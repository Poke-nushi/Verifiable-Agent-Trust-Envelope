name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-evidence:
    name: Execution evidence (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
        include:
          - os: macos-15
            python: "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run execution evidence tests
        run: python -B -m unittest discover -s reference/execution-evidence-demo -p 'test_*.py' -v

      - name: Run receipt linkage tests
        run: python -B -m unittest discover -s reference/receipt-linkage-example -p 'test_*.py' -v

      - name: Replay S3 observations and run offline acceptance checks
        run: |
          python -B reference/s3-observation-example/run_examples.py
          python -B reference/s3-observation-example/test_assessment.py
          python -B -m unittest discover -s reference/s3-observation-example -p 'test_native_fixture.py' -v
          python -B -m unittest discover -s reference/s3-observation-example -p 'test_assess_cli.py' -v

      - name: Check the recipient assessment API and input vectors
        run: |
          python -B reference/recipient-assessment/run_vectors.py
          python -B -m unittest discover -s reference/recipient-assessment -p 'test_*.py' -v

      - name: Select the runner's existing OpenSSL for the signature example
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            trial_openssl="$(brew --prefix openssl@3)/bin/openssl"
          else
            trial_openssl="$(command -v openssl)"
          fi
          test -x "$trial_openssl"
          "$trial_openssl" version
          echo "VATE_TRIAL_OPENSSL=$trial_openssl" >> "$GITHUB_ENV"
          trial_sha="$(python -c 'import hashlib,pathlib,sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$trial_openssl")"
          echo "VATE_TRIAL_OPENSSL_SHA256=$trial_sha" >> "$GITHUB_ENV"

      - name: Check detached signatures and receiver-selected issuer authority
        run: |
          python -B -m unittest discover -s reference/recipient-signature-authority -p 'test_*.py' -v
          output_dir="$(mktemp -d)"
          python -B reference/recipient-signature-authority/run_trial.py --openssl "$VATE_TRIAL_OPENSSL" --openssl-sha256 "$VATE_TRIAL_OPENSSL_SHA256" --output "$output_dir/run"

      - name: Check required records and receiver-selected review controls
        run: |
          python -B -m unittest discover -s reference/required-records -p 'test_*.py' -v
          output_dir="$(mktemp -d)"
          python -B reference/required-records/run_examples.py --openssl "$VATE_TRIAL_OPENSSL" --openssl-sha256 "$VATE_TRIAL_OPENSSL_SHA256" --output "$output_dir/run"

      - name: Check NENRIN saved records and replay the pinned VATE cases
        run: |
          output_dir="$(mktemp -d)"
          python -B reference/nenrin-s3-crosswalk-example/compare_records.py --output "$output_dir/saved.json"
          python -B reference/nenrin-s3-crosswalk-example/replay_vate.py --output "$output_dir/vate"
          python -B reference/nenrin-s3-crosswalk-example/compare_records.py --vate-run "$output_dir/vate" --output "$output_dir/replayed.json"
          python -B -m unittest discover -s reference/nenrin-s3-crosswalk-example/tests -p 'test_*.py' -v

      - name: Run execution evidence CLI from a source archive
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          python -B "$archive_dir/reference/execution-evidence-demo/run_demo.py" --output-name ci

      - name: Run receipt linkage example from a source archive
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          python -B "$archive_dir/reference/receipt-linkage-example/run_examples.py"
          python -B -m unittest discover -s "$archive_dir/reference/receipt-linkage-example" -p 'test_*.py' -v

      - name: Replay S3 observations from a source archive
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          python -B "$archive_dir/reference/s3-observation-example/run_examples.py"
          python -B "$archive_dir/reference/s3-observation-example/test_assessment.py"
          python -B -m unittest discover -s "$archive_dir/reference/s3-observation-example" -p 'test_native_fixture.py' -v
          python -B -m unittest discover -s "$archive_dir/reference/s3-observation-example" -p 'test_assess_cli.py' -v

      - name: Check the recipient API from a source archive
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          python -B "$archive_dir/reference/recipient-assessment/run_vectors.py"
          python -B -m unittest discover -s "$archive_dir/reference/recipient-assessment" -p 'test_*.py' -v

      - name: Check the NENRIN crosswalk from a source archive
        run: |
          archive_dir="$(mktemp -d)"
          output_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$output_dir"
          python -B "$archive_dir/reference/nenrin-s3-crosswalk-example/compare_records.py" --output "$output_dir/saved.json"
          python -B "$archive_dir/reference/nenrin-s3-crosswalk-example/replay_vate.py" --output "$output_dir/vate"
          python -B "$archive_dir/reference/nenrin-s3-crosswalk-example/compare_records.py" --vate-run "$output_dir/vate" --output "$output_dir/replayed.json"
          python -B -m unittest discover -s "$archive_dir/reference/nenrin-s3-crosswalk-example/tests" -p 'test_*.py' -v

      - name: Check signatures and issuer authority from a source archive
        run: |
          archive_dir="$(mktemp -d)"
          output_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$output_dir"
          python -B -m unittest discover -s "$archive_dir/reference/recipient-signature-authority" -p 'test_*.py' -v
          python -B "$archive_dir/reference/recipient-signature-authority/run_trial.py" --openssl "$VATE_TRIAL_OPENSSL" --openssl-sha256 "$VATE_TRIAL_OPENSSL_SHA256" --output "$output_dir/run"

      - name: Check required records from a source archive
        run: |
          archive_dir="$(mktemp -d)"
          output_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$output_dir"
          python -B -m unittest discover -s "$archive_dir/reference/required-records" -p 'test_*.py' -v
          python -B "$archive_dir/reference/required-records/run_examples.py" --openssl "$VATE_TRIAL_OPENSSL" --openssl-sha256 "$VATE_TRIAL_OPENSSL_SHA256" --output "$output_dir/run"

  validate:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python scripts
        run: python -m py_compile scripts/vate_conformance.py scripts/check_repo.py scripts/check_repo_strict.py

      - name: Run quickstart demo
        run: python reference/quickstart-demo/run_demo.py

      - name: Run conformance corpus checks
        run: |
          python scripts/vate_conformance.py run \
            --corpus-root conformance/al2-vate-v0.3 \
            --report /tmp/vate-ci-run.json

          python scripts/vate_conformance.py compare \
            --corpus-root conformance/al2-vate-v0.3 \
            --sut-results examples/conformance/sut-results-pass.example.json \
            --report /tmp/vate-ci-compare.json

          python scripts/vate_conformance.py compare \
            --corpus-root conformance/al2-vate-v0.3 \
            --sut-results examples/conformance/sut-results-pass.example.json \
            --report /tmp/vate-ci-compare-report.json \
            --implementation-report /tmp/vate-ci-implementation-report.json \
            --conformance-report-uri /tmp/vate-ci-compare-report.json \
            --implementation-report-uri /tmp/vate-ci-implementation-report.json

          python scripts/vate_conformance.py verify-bundle \
            --corpus-root conformance/al2-vate-v0.3 \
            --sut-results examples/conformance/sut-results-pass.example.json \
            --conformance-report /tmp/vate-ci-compare-report.json \
            --implementation-report /tmp/vate-ci-implementation-report.json \
            --report /tmp/vate-ci-bundle-verification.json

      - name: Run repository sanity checks
        run: |
          python scripts/check_repo.py --require-full-history
          python scripts/check_repo_strict.py

      - name: Run source-archive sanity check
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          python "$archive_dir/scripts/check_repo.py"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check TypeScript helpers
        run: |
          npm run ts:check
          npm run ts:test
          npm audit --audit-level=moderate

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git diff --check "FETCH_HEAD...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA..$HEAD_SHA"
          else
            git diff --check
          fi
