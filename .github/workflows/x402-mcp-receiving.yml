name: x402 MCP receiving

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test copied standalone reader without site packages
        run: |
          isolated_dir=$(mktemp -d "$RUNNER_TEMP/x402-reader.XXXXXX")
          cp -R reference/x402-mcp-receiving "$isolated_dir/reader"
          python -S -B -m unittest discover -s "$isolated_dir/reader" -p test_receive.py -v
          python -S -B "$isolated_dir/reader/run_examples.py" --out "$isolated_dir/synthetic"
      - name: Install existing repository development requirements
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test reader and Inbox connection
        run: |
          python -B -m unittest discover -s reference/x402-mcp-receiving -p 'test_*.py' -v
          python -B reference/x402-mcp-receiving/run_examples.py --inbox-source-root . --out "$RUNNER_TEMP/x402-synthetic-inbox"
      - name: Replay saved SDK results and retain another attempt
        run: |
          python -B reference/x402-mcp-receiving/run_sdk_examples.py \
            --capture reference/x402-mcp-receiving/captures/first \
            --inbox-source-root . --out "$RUNNER_TEMP/x402-intake-first"
          python -B reference/x402-mcp-receiving/check_second_attempt.py \
            --first-intake "$RUNNER_TEMP/x402-intake-first" \
            --capture reference/x402-mcp-receiving/captures/second \
            --inbox-source-root . --out "$RUNNER_TEMP/x402-intake-second"
