name: AuthZEN receipt vectors

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Replay originals and exercise capture from a source archive
        run: |
          archive_root=$(mktemp -d)
          trap 'rm -rf "$archive_root"' EXIT
          git archive HEAD reference/authzen-receipt-vectors reference/historical-runtime/f1286390 | tar -x -C "$archive_root"
          cd "$archive_root"
          python -E -s -S -B reference/authzen-receipt-vectors/verify.py
          python -E -s -S -B -m unittest discover -s reference/authzen-receipt-vectors -p 'test_*.py' -v
