name: ACS log reader

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Test copied standalone folder without site packages
        run: |
          isolated_dir=$(mktemp -d "$RUNNER_TEMP/acs-reader.XXXXXX")
          cp -R reference/acs-log-reader "$isolated_dir/reader"
          python -S -B -m unittest discover -s "$isolated_dir/reader" -p 'test_*.py' -v
      - name: Install existing VATE validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Preserve originals and both readings in Recipient Inbox
        run: |
          output_parent=$(mktemp -d "$RUNNER_TEMP/acs-inbox.XXXXXX")
          python -B reference/acs-log-reader/run_example.py --out "$output_parent/run"
