<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where VATE Fits — Local Admission and Linked Outcome Evidence</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --surface: #0b0b12;
      --surface-strong: #10101a;
      --text: #f6f2ff;
      --muted: #bbb4c8;
      --fine: #8e879d;
      --line: #332d43;
      --purple: #b892ff;
      --allow: #7fd8a4;
      --attenuate: #ebc970;
      --deny: #ff8fa0;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      overflow: auto;
      font-family: var(--sans);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1200px;
      height: auto;
      background: var(--bg);
    }

    .mobile-board { display: none; }

    .region-label {
      fill: var(--fine);
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .step {
      fill: var(--purple);
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .title {
      fill: var(--text);
      font-family: var(--sans);
      font-size: 30px;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .title-large {
      fill: var(--text);
      font-family: var(--sans);
      font-size: 36px;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    .copy {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 19px;
    }

    .copy-small {
      fill: var(--fine);
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 520;
    }

    .outcome {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 750;
    }

    .branch {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 650;
    }

    .mobile-step {
      fill: var(--purple);
      font-family: var(--mono);
      font-size: 30px;
      font-weight: 750;
      letter-spacing: 0.1em;
    }

    .mobile-title {
      fill: var(--text);
      font-family: var(--sans);
      font-size: 46px;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    .mobile-copy {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 34px;
    }

    .mobile-branch {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
    }

    @media (max-width: 1000px) {
      .desktop-board { display: none; }
      .mobile-board {
        display: block;
        min-width: 720px;
      }
    }
  </style>
</head>
<body>
  <svg class="desktop-board" viewBox="0 0 1600 900" role="img" aria-labelledby="desktop-title desktop-desc">
    <title id="desktop-title">Where VATE fits</title>
    <desc id="desktop-desc">
      One concrete request basis and digest-addressed evidence references enter
      local VATE admission at the consequence-owning relying party. Integrity,
      authority, and policy checks produce an admission receipt with allow,
      attenuate, or deny. A separate implementation-owned handoff gate passes
      allow and eligible attenuation to the target, while deny, invalid input,
      and attenuation requiring a fresh permit stop. Later outcome evidence links
      to the admission receipt id and digest, transaction and runtime, and
      effective request hash.
    </desc>
    <defs>
      <linearGradient id="bg-glow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b0811"/>
        <stop offset="0.5" stop-color="#050507"/>
        <stop offset="1" stop-color="#090610"/>
      </linearGradient>
      <radialGradient id="admission-glow" cx="50%" cy="48%" r="58%">
        <stop offset="0" stop-color="#6f3bd4" stop-opacity="0.2"/>
        <stop offset="1" stop-color="#6f3bd4" stop-opacity="0"/>
      </radialGradient>
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M48 0H0V48" fill="none" stroke="#1b1724" stroke-width="1"/>
      </pattern>
      <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0 0L12 5L0 10Z" fill="#9b93a9"/>
      </marker>
      <marker id="arrow-purple" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0 0L12 5L0 10Z" fill="#b892ff"/>
      </marker>
      <marker id="arrow-go" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0 0L12 5L0 10Z" fill="#7fd8a4"/>
      </marker>
    </defs>

    <rect width="1600" height="900" fill="url(#bg-glow)"/>
    <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="800" cy="430" rx="450" ry="390" fill="url(#admission-glow)"/>

    <!-- Region boundaries stay behind the directional flow. -->
    <line x1="470" y1="90" x2="470" y2="810" stroke="#302a3f" stroke-width="2"/>
    <line x1="1060" y1="90" x2="1060" y2="810" stroke="#302a3f" stroke-width="2"/>

    <!-- Connection layer: above region boundaries, below opaque boxes. -->
    <path d="M418 448H515" fill="none" stroke="#9b93a9" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M760 408V495" fill="none" stroke="#b892ff" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <path d="M1005 560H1035V340H1090" fill="none" stroke="#b892ff" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <path d="M1375 525V610" fill="none" stroke="#7fd8a4" stroke-width="3" marker-end="url(#arrow-go)"/>
    <path d="M1090 774H1040V690H1005" fill="none" stroke="#b892ff" stroke-width="3" stroke-dasharray="11 10" marker-end="url(#arrow-purple)"/>

    <text class="region-label" x="70" y="92">SUPPLIED BASIS</text>
    <text class="region-label" x="515" y="92">CONSEQUENCE-OWNING RELYING PARTY</text>
    <text class="region-label" x="1090" y="92">IMPLEMENTATION + OUTCOME</text>

    <rect x="70" y="300" width="348" height="296" rx="6" fill="#0b0b12"/>
    <rect x="70" y="300" width="348" height="296" rx="6" fill="none" stroke="#5a5368" stroke-width="2"/>
    <text class="step" x="104" y="345">01</text>
    <text class="title" x="104" y="400">One concrete request</text>
    <text class="title" x="104" y="438">+ evidence references</text>
    <line x1="104" y1="470" x2="384" y2="470" stroke="#302a3f" stroke-width="2"/>
    <text class="copy" x="104" y="514">declared input hash</text>
    <text class="copy" x="104" y="552">digest-addressed refs</text>

    <rect x="515" y="205" width="490" height="203" rx="6" fill="#10101a"/>
    <rect x="515" y="205" width="490" height="203" rx="6" fill="none" stroke="#b892ff" stroke-width="3"/>
    <text class="step" x="552" y="252">02</text>
    <text class="title-large" x="552" y="312">Local VATE admission</text>
    <text class="copy" x="552" y="362">Integrity  →  authority  →  policy</text>

    <rect x="515" y="495" width="490" height="210" rx="6" fill="#10101a"/>
    <rect x="515" y="495" width="490" height="210" rx="6" fill="none" stroke="#b892ff" stroke-width="3"/>
    <text class="step" x="552" y="542">03</text>
    <text class="title-large" x="552" y="599">Admission receipt</text>
    <rect x="552" y="629" width="96" height="40" rx="3" fill="none" stroke="#7fd8a4" stroke-width="2"/>
    <text class="outcome" x="570" y="655" fill="#7fd8a4">allow</text>
    <rect x="662" y="629" width="140" height="40" rx="3" fill="none" stroke="#ebc970" stroke-width="2"/>
    <text class="outcome" x="680" y="655" fill="#ebc970">attenuate</text>
    <rect x="816" y="629" width="88" height="40" rx="3" fill="none" stroke="#ff8fa0" stroke-width="2"/>
    <text class="outcome" x="834" y="655" fill="#ff8fa0">deny</text>

    <rect x="1090" y="170" width="460" height="355" rx="6" fill="#0b0b12"/>
    <rect x="1090" y="170" width="460" height="355" rx="6" fill="none" stroke="#5a5368" stroke-width="2"/>
    <text class="step" x="1125" y="215">04</text>
    <text class="title" x="1125" y="270">Implementation-owned</text>
    <text class="title" x="1125" y="308">handoff gate</text>
    <line x1="1125" y1="338" x2="1515" y2="338" stroke="#302a3f" stroke-width="2"/>
    <text class="branch" x="1125" y="375" fill="#7fd8a4">GO · allow</text>
    <text class="branch" x="1125" y="407" fill="#7fd8a4">GO · attenuate + no new permit</text>
    <text class="branch" x="1125" y="442" fill="#ff8fa0">STOP · deny / invalid</text>
    <text class="branch" x="1125" y="477" fill="#ff8fa0">STOP · attenuate</text>
    <text class="branch" x="1125" y="507" fill="#ff8fa0">+ fresh permit required</text>

    <rect x="1320" y="552" width="110" height="36" rx="3" fill="#050507"/>
    <text class="copy-small" x="1375" y="577" text-anchor="middle">TARGET</text>
    <rect x="1090" y="610" width="460" height="220" rx="6" fill="#0b0b12"/>
    <rect x="1090" y="610" width="460" height="220" rx="6" fill="none" stroke="#b892ff" stroke-width="3"/>
    <text class="step" x="1125" y="650">05</text>
    <text class="title" x="1125" y="700">Linked outcome evidence</text>
    <text class="copy-small" x="1125" y="744">receipt ID + digest</text>
    <text class="copy-small" x="1125" y="778">transaction + runtime</text>
    <text class="copy-small" x="1125" y="812">effective request hash · selected fields</text>
  </svg>

  <svg class="mobile-board" viewBox="0 0 900 1200" role="img" aria-labelledby="mobile-title mobile-desc">
    <title id="mobile-title">Where VATE fits, mobile overview</title>
    <desc id="mobile-desc">
      Three bands show the supplied request and evidence references, local VATE
      admission and its admission receipt, and the implementation-owned handoff
      gate followed by linked outcome evidence.
    </desc>
    <defs>
      <linearGradient id="mobile-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b0811"/>
        <stop offset="0.55" stop-color="#050507"/>
        <stop offset="1" stop-color="#090610"/>
      </linearGradient>
      <pattern id="mobile-grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M48 0H0V48" fill="none" stroke="#1b1724" stroke-width="1"/>
      </pattern>
      <marker id="mobile-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0 0L12 5L0 10Z" fill="#b892ff"/>
      </marker>
    </defs>
    <rect width="900" height="1200" fill="url(#mobile-bg)"/>
    <rect width="900" height="1200" fill="url(#mobile-grid)" opacity="0.55"/>

    <!-- Connection layer. -->
    <path d="M450 346V402" fill="none" stroke="#b892ff" stroke-width="5" marker-end="url(#mobile-arrow)"/>
    <path d="M450 762V800" fill="none" stroke="#b892ff" stroke-width="5" marker-end="url(#mobile-arrow)"/>

    <rect x="60" y="58" width="780" height="288" rx="8" fill="#0b0b12"/>
    <rect x="60" y="58" width="780" height="288" rx="8" fill="none" stroke="#5a5368" stroke-width="3"/>
    <text class="mobile-step" x="104" y="112">01 · SUPPLIED BASIS</text>
    <text class="mobile-title" x="104" y="177">One request + evidence refs</text>
    <text class="mobile-copy" x="104" y="244">declared input hash</text>
    <text class="mobile-copy" x="104" y="296">digest-addressed references</text>

    <rect x="60" y="402" width="780" height="360" rx="8" fill="#10101a"/>
    <rect x="60" y="402" width="780" height="360" rx="8" fill="none" stroke="#b892ff" stroke-width="4"/>
    <text class="mobile-step" x="104" y="456">02 · LOCAL DECISION</text>
    <text class="mobile-title" x="104" y="521">Local VATE admission</text>
    <text class="mobile-copy" x="104" y="583">Integrity → authority → policy</text>
    <line x1="104" y1="624" x2="796" y2="624" stroke="#332d43" stroke-width="3"/>
    <text class="mobile-title" x="104" y="687">Admission receipt</text>
    <text class="mobile-branch" x="104" y="736" fill="#7fd8a4">allow</text>
    <text class="mobile-branch" x="238" y="736" fill="#ebc970">attenuate</text>
    <text class="mobile-branch" x="452" y="736" fill="#ff8fa0">deny</text>

    <rect x="60" y="800" width="780" height="360" rx="8" fill="#0b0b12"/>
    <rect x="60" y="800" width="780" height="360" rx="8" fill="none" stroke="#b892ff" stroke-width="4"/>
    <text class="mobile-step" x="104" y="845">03 · HANDOFF + OUTCOME</text>
    <text class="mobile-title" x="104" y="900">Implementation-owned gate</text>
    <text class="mobile-branch" x="104" y="946" fill="#7fd8a4">GO · allow</text>
    <text class="mobile-branch" x="104" y="982" fill="#7fd8a4">GO · attenuate + no new permit</text>
    <text class="mobile-branch" x="104" y="1018" fill="#ff8fa0">STOP · deny / invalid</text>
    <text class="mobile-branch" x="104" y="1054" fill="#ff8fa0">STOP · attenuate + fresh permit required</text>
    <text class="mobile-title" x="104" y="1114" style="font-size: 40px">Target → linked outcome evidence</text>
  </svg>
</body>
</html>
