<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where VATE Fits — Local Admission and Linked Outcome Evidence</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --surface: #0b0b12;
      --surface-strong: #10101a;
      --text: #f6f2ff;
      --muted: #bbb4c8;
      --fine: #8e879d;
      --line: #332d43;
      --purple: #b892ff;
      --allow: #7fd8a4;
      --attenuate: #e8c36a;
      --deny: #ff8fa0;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      overflow: auto;
      font-family: var(--sans);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg);
    }

    .mobile-board { display: none; }

    .region-label {
      fill: var(--fine);
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .step {
      fill: var(--purple);
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .title {
      fill: var(--text);
      font-family: var(--sans);
      font-size: 30px;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .title-large {
      fill: var(--text);
      font-family: var(--sans);
      font-size: 36px;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    .copy {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 19px;
    }

    .copy-small {
      fill: var(--fine);
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 520;
    }

    .outcome {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 750;
    }

    .branch {
      font-family: var(--sans);
      font-size: 23px;
      font-weight: 570;
    }

    .mobile-step {
      fill: var(--purple);
      font-family: var(--mono);
      font-size: 30px;
      font-weight: 750;
      letter-spacing: 0.1em;
    }

    .mobile-title {
      fill: var(--text);
      font-family: var(--sans);
      font-size: 46px;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    .mobile-copy {
      fill: var(--muted);
      font-family: var(--mono);
      font-size: 34px;
    }

    .mobile-branch {
      font-family: var(--sans);
      font-size: 38px;
      font-weight: 600;
    }

    @media (max-width: 767px) {
      .desktop-board { display: none; }
      .mobile-board { display: block; }
    }
  </style>
</head>
<body>
  <svg class="desktop-board" viewBox="0 0 1600 900" role="img" aria-labelledby="desktop-title desktop-desc">
    <title id="desktop-title">Where VATE fits</title>
    <desc id="desktop-desc">
      One concrete request basis and digest-addressed evidence references enter
      local VATE admission at the consequence-owning relying party. Integrity,
      authority, and policy checks produce an admission receipt with allow,
      attenuate, or deny. Allow makes the original request a handoff candidate.
      Attenuation makes only the narrowed request a candidate when no fresh permit
      is required. The implementation checks whether it can hand that request
      to the target. Denial, failed checks or a required fresh permit stop handoff.
      After handoff the target may attempt the operation. Later outcome evidence, when available, links
      to the admission receipt id and digest, transaction and runtime, and
      effective request hash.
    </desc>
    <defs>
      <linearGradient id="bg-glow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b0811"/>
        <stop offset="0.5" stop-color="#050507"/>
        <stop offset="1" stop-color="#090610"/>
      </linearGradient>
      <radialGradient id="admission-glow" cx="50%" cy="48%" r="58%">
        <stop offset="0" stop-color="#6f3bd4" stop-opacity="0.2"/>
        <stop offset="1" stop-color="#6f3bd4" stop-opacity="0"/>
      </radialGradient>
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M48 0H0V48" fill="none" stroke="#1b1724" stroke-width="1"/>
      </pattern>
      <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0 0L12 5L0 10Z" fill="#9b93a9"/>
      </marker>
      <marker id="arrow-purple" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0 0L12 5L0 10Z" fill="#b892ff"/>
      </marker>
      <marker id="target-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
        <path d="M0 0L14 6L0 12Z" fill="#bbb4c8"/>
      </marker>
    </defs>

    <rect width="1600" height="900" fill="url(#bg-glow)"/>
    <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="800" cy="430" rx="450" ry="390" fill="url(#admission-glow)"/>

    <!-- Region boundaries stay behind the directional flow. -->
    <line x1="470" y1="90" x2="470" y2="810" stroke="#302a3f" stroke-width="2"/>
    <line x1="1060" y1="90" x2="1060" y2="810" stroke="#302a3f" stroke-width="2"/>

    <!-- Connection layer: above region boundaries, below opaque boxes. -->
    <path d="M418 448H515" fill="none" stroke="#9b93a9" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M760 408V495" fill="none" stroke="#b892ff" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <path d="M1005 560H1035V340H1090" fill="none" stroke="#b892ff" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <path d="M1320 525V557" fill="none" stroke="#bbb4c8" stroke-width="3" marker-end="url(#target-arrow)"/>
    <path d="M1320 613V654" fill="none" stroke="#bbb4c8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#target-arrow)"/>
    <path d="M1090 774H1040V690H1005" fill="none" stroke="#b892ff" stroke-width="3" stroke-dasharray="11 10" marker-end="url(#arrow-purple)"/>

    <text class="region-label" x="70" y="92">SUPPLIED BASIS</text>
    <text class="region-label" x="515" y="92">CONSEQUENCE-OWNING RELYING PARTY</text>
    <text class="region-label" x="1090" y="92">IMPLEMENTATION + OUTCOME</text>

    <rect x="70" y="300" width="348" height="296" fill="#0b0b12"/>
    <rect x="70" y="300" width="348" height="296" fill="none" stroke="#5a5368" stroke-width="2"/>
    <text class="step" x="104" y="345">01</text>
    <text class="title" x="104" y="400">One concrete request</text>
    <text class="title" x="104" y="438">+ evidence references</text>
    <line x1="104" y1="470" x2="384" y2="470" stroke="#302a3f" stroke-width="2"/>
    <text class="copy" x="104" y="514">declared input hash</text>
    <text class="copy" x="104" y="552">digest-addressed refs</text>

    <rect x="515" y="205" width="490" height="203" fill="#10101a"/>
    <rect x="515" y="205" width="490" height="203" fill="none" stroke="#b892ff" stroke-width="3"/>
    <text class="step" x="552" y="252">02</text>
    <text class="title-large" x="552" y="312">Local VATE admission</text>
    <text class="copy" x="552" y="362">Integrity  →  authority  →  policy</text>

    <rect x="515" y="495" width="490" height="210" fill="#10101a"/>
    <rect x="515" y="495" width="490" height="210" fill="none" stroke="#b892ff" stroke-width="3"/>
    <text class="step" x="552" y="542">03</text>
    <text class="title-large" x="552" y="599">Admission receipt</text>
    <rect x="552" y="629" width="96" height="40" fill="none" stroke="#7fd8a4" stroke-width="2"/>
    <text class="outcome" x="570" y="655" fill="#7fd8a4">allow</text>
    <rect x="662" y="629" width="140" height="40" fill="none" stroke="#e8c36a" stroke-width="2"/>
    <text class="outcome" x="680" y="655" fill="#e8c36a">attenuate</text>
    <rect x="816" y="629" width="88" height="40" fill="none" stroke="#ff8fa0" stroke-width="2"/>
    <text class="outcome" x="834" y="655" fill="#ff8fa0">deny</text>

    <rect x="1090" y="150" width="460" height="375" fill="#0b0b12" stroke="#5a5368" stroke-width="2"/>
    <text class="step" x="1125" y="187">04</text>
    <text class="title" x="1125" y="229">Implementation-owned</text>
    <text class="title" x="1125" y="264">handoff gate</text>
    <line x1="1125" y1="283" x2="1515" y2="283" stroke="#302a3f" stroke-width="2"/>
    <text class="branch" x="1125" y="319" fill="#b892ff">Candidates for further checks</text>
    <text class="branch" x="1125" y="353" fill="#f6f2ff">allow → original request</text>
    <text class="branch" x="1125" y="385" fill="#f6f2ff">attenuate → narrowed request</text>
    <text class="branch" x="1145" y="414" fill="#bbb4c8">if no fresh permit is required</text>
    <text class="branch" x="1125" y="461" fill="#ff8fa0">Stop on deny, failed checks,</text>
    <text class="branch" x="1125" y="492" fill="#ff8fa0">or a required fresh permit</text>

    <rect x="1113" y="558" width="414" height="54" fill="#17151e" stroke="#797184" stroke-width="2"/>
    <text class="branch" x="1320" y="593" text-anchor="middle" fill="#f6f2ff">Target may attempt the operation</text>
    <rect x="1090" y="655" width="460" height="200" fill="#0b0b12" stroke="#b892ff" stroke-width="3"/>
    <text class="step" x="1125" y="688">05 · WHEN AVAILABLE</text>
    <text class="title" x="1125" y="732">Linked outcome evidence</text>
    <text class="copy-small" x="1125" y="771">receipt ID + digest</text>
    <text class="copy-small" x="1125" y="802">transaction + runtime</text>
    <text class="copy-small" x="1125" y="833">effective request hash · selected fields</text>
  </svg>

  <svg class="mobile-board" viewBox="0 0 900 1200" role="img" aria-labelledby="mobile-title mobile-desc">
    <title id="mobile-title">Where VATE fits, mobile overview</title>
    <desc id="mobile-desc">
      Three bands show the supplied request and evidence references, local VATE
      admission and its admission receipt, and the implementation-owned handoff gate.
      Allow and eligible attenuation make the original or narrowed request a
      candidate for further checks. Denial, failed checks or a required fresh
      permit stop handoff. After handoff the target may attempt the operation.
      A later outcome receipt can link back to the admission receipt.
    </desc>
    <defs>
      <linearGradient id="mobile-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b0811"/>
        <stop offset="0.55" stop-color="#050507"/>
        <stop offset="1" stop-color="#090610"/>
      </linearGradient>
      <pattern id="mobile-grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M48 0H0V48" fill="none" stroke="#1b1724" stroke-width="1"/>
      </pattern>
      <marker id="mobile-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
        <path d="M0 0L12 5L0 10Z" fill="#b892ff"/>
      </marker>
    </defs>
    <rect width="900" height="1200" fill="url(#mobile-bg)"/>
    <rect width="900" height="1200" fill="url(#mobile-grid)" opacity="0.55"/>

    <!-- Connection layer. -->
    <path d="M450 265V315" fill="none" stroke="#b892ff" stroke-width="5" marker-end="url(#mobile-arrow)"/>
    <path d="M450 609V659" fill="none" stroke="#b892ff" stroke-width="5" marker-end="url(#mobile-arrow)"/>

    <rect x="60" y="40" width="780" height="225" fill="#0b0b12" stroke="#5a5368" stroke-width="3"/>
    <text class="mobile-step" x="104" y="86">01 · SUPPLIED BASIS</text>
    <text class="mobile-title" x="104" y="144">One request + evidence refs</text>
    <text class="mobile-copy" x="104" y="195">declared input hash</text>
    <text class="mobile-copy" x="104" y="237">digest-addressed references</text>

    <rect x="60" y="315" width="780" height="294" fill="#10101a" stroke="#b892ff" stroke-width="4"/>
    <text class="mobile-step" x="104" y="361">02 · LOCAL DECISION</text>
    <text class="mobile-title" x="104" y="417">Local VATE admission</text>
    <text class="mobile-copy" x="104" y="465">Integrity → authority → policy</text>
    <line x1="104" y1="488" x2="796" y2="488" stroke="#332d43" stroke-width="3"/>
    <text class="mobile-title" x="104" y="542">Admission receipt</text>
    <text class="mobile-branch" x="104" y="585" fill="#7fd8a4">allow</text>
    <text class="mobile-branch" x="254" y="585" fill="#e8c36a">attenuate</text>
    <text class="mobile-branch" x="461" y="585" fill="#ff8fa0">deny</text>

    <rect x="60" y="659" width="780" height="501" fill="#0b0b12" stroke="#b892ff" stroke-width="4"/>
    <text class="mobile-step" x="104" y="702">03 · HANDOFF + OUTCOME</text>
    <text class="mobile-title" x="104" y="754">Implementation-owned gate</text>
    <text class="mobile-branch" x="104" y="803" fill="#b892ff">Candidates for further checks</text>
    <text class="mobile-branch" x="104" y="848" fill="#f6f2ff">allow → original request</text>
    <text class="mobile-branch" x="104" y="891" fill="#f6f2ff">attenuate → narrowed request</text>
    <text class="mobile-branch" x="138" y="934" fill="#bbb4c8">if no fresh permit is required</text>
    <text class="mobile-branch" x="104" y="984" fill="#ff8fa0">Stop on deny, failed checks,</text>
    <text class="mobile-branch" x="104" y="1027" fill="#ff8fa0">or a required fresh permit</text>
    <line x1="104" y1="1052" x2="796" y2="1052" stroke="#5a5368" stroke-width="3"/>
    <text class="mobile-branch" x="104" y="1096" fill="#f6f2ff">Target may attempt the operation</text>
    <text class="mobile-branch" x="104" y="1139" fill="#d3b9ff">Outcome receipt → admission receipt</text>
  </svg>
</body>
</html>
